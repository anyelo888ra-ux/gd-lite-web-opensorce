<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDLite Emulator</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#020617;color:#f8fafc}
    body{display:grid;place-items:center}
    main{width:min(720px,92vw);padding:32px;text-align:center;border:1px solid #334155;border-radius:16px;background:#0f172a}
    h1{margin-top:0}
    p{color:#cbd5e1;line-height:1.5}
    .status{display:inline-block;padding:9px 14px;border-radius:8px;background:#334155}
    code{color:#e2e8f0}
  </style>
</head>
<body>
  <main>
    <h1>GDLite Android Emulator</h1>
    <p>La ruta del emulador está funcionando correctamente en GitHub Pages.</p>
    <p>Esta página es el frontend de prueba. El APK y el runtime Android deben ejecutarse en un backend; GitHub Pages no puede ejecutar un archivo <code>.apk</code> directamente.</p>
    <div class="status">Backend Android: esperando conexión</div>
  </main>
</body>
</html>
